<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Calculate your grades easily with our online grade calculator. Enter marks for different subjects and get your total marks and percentage.">
    <meta name="keywords" content="grade calculator, online calculator, student grades">
    <meta name="author" content="Vishnu V">
   <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
   <link rel="stylesheet" href="assets/style.css">
    <title>Grade calculator</title>
</head>
<body>
<!-- Main-container -->
  <div class="container py-5 ">   
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6 ">
        <div class="card shadow">
          <div class="card-header bg-primary text-white text-center py-3 rounded-top">
            <h1 class="h3 mb-0">Grade Calculator</h1>
          </div>
          <!-- Marks-input-form-start -->
          <div class="card-body">
            <form action="" id="grade-form">
              <div class="mb-3">
                <label for="subject1" class="form-label">Subject:1</label>
                <input type="number" name="" id="subject1" min="0" max="100" class="form-control" placeholder="Enter Marks" required>
              </div>
              <div class="mb-3">
                <label for="subject2" class="form-label">Subject:2</label>
                <input type="number" name="" id="subject2" min="0" max="100" class="form-control" placeholder="Enter Marks" required>
              </div>
              <div class="mb-3">
                <label for="subject3" class="form-label">Subject:3</label>
                <input type="number" name="" id="subject3" min="0" max="100" class="form-control" placeholder="Enter Marks" required>
              </div>
              <div class="mb-3">
                <label for="subject4" class="form-label">Subject:4</label>
                <input type="number" name="" id="subject4" min="0" max="100" class="form-control" placeholder="Enter Marks" required>
              </div>
              <div class="mb-3">
                <label for="subject5" class="form-label">Subject:5</label>
                <input type="number" name="" id="subject5" min="0" max="100" class="form-control" placeholder="Enter Marks" required>
              </div>
              <button type="button" id="calculate-btn" class="btn btn-primary w-100 py-2 ">Calculate Grade</button>
            </form>
          <!-- Marks-input-form-end -->

          <!-- Result-section -->
            <div class="mt-4 p-3 bg-light rounded" id="result">
              <h4 class="text-center mb-3">Result</h4>
              <div class="row mb-2 border-bottom pb-2">
                <div class="col-6 fw-bold">Total marks:</div>
                <div class="col-6 text-end" id="total-marks">-</div>
              </div>
              <div class="row mb-2 border-bottom pb-2">
                <div class="col-6 fw-bold">Average marks:</div>
                <div class="col-6 text-end" id="average-marks">-</div>
              </div>
              <div class="row">
                <div class="col-6 fw-bold">Grade:</div>
                <div class="col-6 text-end" id="grade">-</div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
 
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
   <script src="assets/script.js"></script>
   </body>
</html>
